<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Бамбул</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;600;800&family=Rubik+Dirt&display=swap">
<style>
/* Layout: one full-screen stage (canvas) with thin HUD strips on top; menus are taped-up paper notes over the dim apartment. Single committed dark look. */
:root{
  color-scheme:dark;
  --ink:#12100e;        /* stage dark, warm */
  --soot:#221d19;       /* panels */
  --paper:#efe2c4;      /* yellowed wallpaper cream: text and notes */
  --mustard:#d9a93a;    /* from the shirt */
  --navy:#2d3050;       /* shirt line work */
  --rust:#c2512f;       /* deadline, danger */
  --moss:#86ad55;       /* done */
  --dim:#a89a80;
  --f-display:'Rubik Dirt','Impact','Arial Black',sans-serif;
  --f-body:'Golos Text','Segoe UI',Roboto,Arial,sans-serif;
  --f-note:'Caveat','Comic Sans MS','Segoe Print',cursive;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;overflow:hidden;overscroll-behavior:none}
#app{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.clock{position:absolute;left:16px;top:10px;background:var(--soot);border:2px solid var(--navy);padding:4px 12px 6px;transform:rotate(-1.5deg);box-shadow:3px 3px 0 #0008}
.clock span{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums;display:block}
.clock.low span{color:var(--rust)}
.clock small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.clean{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(34vw,300px);text-align:center}
.clean .bar{height:12px;background:#0009;border:2px solid var(--navy)}
.clean .bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--mustard) 0 8px,#c4952c 8px 16px);transition:width .4s}
.clean small{font-size:12px;color:var(--paper);text-shadow:0 1px 2px #000}
.hbtns{position:absolute;right:16px;top:10px;display:flex;gap:8px}
.hbtns button,.slot{background:var(--soot);border:2px solid var(--navy);min-width:44px;min-height:44px;padding:0 12px;font-weight:600;box-shadow:3px 3px 0 #0008}
.hbtns button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0008}
#tools{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}
.slot{font-size:12px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.slot b{font-size:10px;color:var(--dim);font-weight:400}
.slot.on{border-color:var(--mustard);background:#3a2f18}
.slot[disabled]{opacity:.35}
.touch #tools{bottom:auto;top:62px}
.touch .slot b{display:none}

/* incoming call */
#ring{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--soot);border:2px solid var(--mustard);padding:10px 14px;display:flex;gap:12px;align-items:center;z-index:30;box-shadow:4px 4px 0 #000a;animation:buzz .5s infinite;max-width:calc(100% - 32px)}
#ring p{margin:0;min-width:0}
#ring small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
#ring button{min-height:44px;padding:0 14px;border:0;font-weight:800}
#rYes{background:var(--moss);color:#111}
#rNo{background:var(--rust);color:#fff}
@keyframes buzz{0%,100%{margin-left:0}25%{margin-left:-3px}75%{margin-left:3px}}

/* touch controls */
#touch{position:absolute;inset:0;pointer-events:none;z-index:5}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:22px;width:132px;height:132px;border-radius:50%;background:#efe2c41a;border:2px solid #efe2c455;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#efe2c488;border:2px solid var(--navy)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid #efe2c466;background:#221d19cc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1}
.tb small{font-size:9px;font-weight:400;color:var(--dim);margin-top:3px}
.tb.down{background:var(--mustard);color:#111}
.tb.down small{color:#111}
#tE{right:max(18px,env(safe-area-inset-right));bottom:74px;width:78px;height:78px}
#tF{right:104px;bottom:22px;width:72px;height:72px}
#tJ{right:108px;bottom:106px;width:58px;height:58px;font-size:18px}

/* dialogue */
#dlg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(680px,calc(100% - 32px));background:var(--soot);border:2px solid var(--navy);box-shadow:5px 5px 0 #000a;padding:12px 14px;z-index:40;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
#dlgAv{grid-row:1/3;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;background:var(--navy);color:var(--paper)}
#dlgWho{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mustard)}
#dlgTxt{margin:0;font-size:17px;line-height:1.35;min-width:0;min-height:2.7em}
#dlgBtns{grid-column:1/3;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{background:var(--mustard);color:#16120c;border:0;min-height:44px;padding:8px 18px;font-weight:800;box-shadow:4px 4px 0 var(--navy);text-align:left}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}
.btn.alt{background:var(--paper)}
.btn.bad{background:var(--rust);color:#fff}

/* minigames */
#mg{position:absolute;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:16px}
.mgbox{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--soot);border:2px solid var(--mustard);box-shadow:6px 6px 0 #000a;padding:14px 16px 16px}
.mgbox header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mgbox h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;text-wrap:balance}
#mgX{background:none;border:2px solid var(--navy);min-height:40px;padding:0 12px;color:var(--dim)}
#mgH{margin:6px 0 12px;color:var(--dim);font-size:14px}
.tbar{position:relative;height:46px;background:#0c0a09;border:2px solid var(--navy);overflow:hidden}
.tzone{position:absolute;top:0;bottom:0;background:var(--moss);opacity:.85}
.tmark{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--paper)}
.dots{display:flex;gap:6px;margin:10px 0}
.dots i{width:16px;height:16px;border:2px solid var(--navy);border-radius:50%}
.dots i.ok{background:var(--moss);border-color:var(--moss)}
.mgbig{width:100%;margin-top:12px;font-size:20px;text-align:center;min-height:64px}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rub{display:block;width:100%;height:auto;touch-action:none;border:2px solid var(--navy);cursor:crosshair;background:#0c0a09}
.fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fr button{background:#e8eef0;color:#1a1a1a;border:0;border-bottom:4px solid #9fb0b6;padding:8px 10px;text-align:left;min-height:64px;font-weight:600;font-size:14px}
.fr button small{display:block;font-weight:400;color:#555;font-size:12px}
.fr button.gone{visibility:hidden}
.gauge{position:relative;height:40px;background:linear-gradient(90deg,#2b4a6b,#c9a23a 55%,#c2512f);border:2px solid var(--navy)}
.gauge .tzone{background:none;border:3px solid var(--paper);opacity:1}
.temp{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;margin:8px 0}
.prog{height:10px;background:#0c0a09;border:2px solid var(--navy);margin-top:10px}
.prog i{display:block;height:100%;width:0;background:var(--moss)}

/* menus: paper note taped over the room */
#menu{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,#12100e99,#12100eee);overflow:auto}
.sheet{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.title{font-family:var(--f-display);font-weight:400;font-size:clamp(56px,15vw,120px);line-height:.9;margin:0;color:var(--mustard);text-shadow:5px 5px 0 var(--navy);letter-spacing:.02em}
.tag{margin:0;font-size:18px;max-width:34ch}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:34px;margin:0;color:var(--mustard);text-wrap:balance}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(300px,100%)}
.rowb{display:flex;flex-wrap:wrap;gap:10px}
.fine{color:var(--dim);font-size:13px;margin:0;max-width:60ch}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.keys dt{font-weight:800;color:var(--mustard);white-space:nowrap}
.keys dd{margin:0;min-width:0}
.set{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}
.set input[type=checkbox]{width:24px;height:24px;accent-color:var(--mustard)}
.set input[type=range]{accent-color:var(--mustard);width:150px;max-width:50vw}
.paper{background:var(--paper);color:#2a2219;font-family:var(--f-note);font-size:22px;line-height:1.2;padding:18px 20px 16px;box-shadow:6px 8px 0 #0007;transform:rotate(-1deg);position:relative;width:100%}
.paper::before{content:"";position:absolute;left:50%;top:-12px;width:90px;height:24px;margin-left:-45px;background:#d9a93aaa;transform:rotate(2deg)}
.paper h3{margin:8px 0 2px;font-size:24px;font-weight:700;border-bottom:1px solid #2a221955}
.paper ul{margin:0;padding:0;list-style:none}
.paper li{display:flex;justify-content:space-between;gap:12px}
.paper li.done{text-decoration:line-through;color:#6c8a3f}
.paper li span:last-child{white-space:nowrap}
.grade{font-family:var(--f-display);font-size:54px;color:var(--mustard);line-height:1;text-shadow:3px 3px 0 var(--navy)}
#note{position:absolute;inset:0;z-index:45;display:grid;place-items:center;padding:16px;background:#000a;overflow:auto}
#note .paper{max-width:440px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:60;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(28px,7vw,54px);color:var(--paper);text-align:center;padding:16px}
#fade.on{opacity:1}
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:var(--paper);color:#2a2219;font-family:var(--f-note);font-size:22px;padding:4px 16px;z-index:35;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#pv{position:absolute;left:0;right:0;top:0;z-index:55;background:var(--soot);border-bottom:2px solid var(--navy);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px;max-height:34%;overflow:auto}
#pv button{background:#0006;border:2px solid var(--navy);min-height:40px;padding:0 10px;font-size:13px}
#pv button.on{border-color:var(--mustard);color:var(--mustard)}
@media (max-width:560px){.clean{left:16px;right:16px;top:60px;transform:none;width:auto}.clock span{font-size:22px}.clock small{font-size:9px}#dlgTxt{font-size:15px}.touch #tools,#tools{top:96px;bottom:auto}.slot{min-height:36px;padding:2px 8px}.slot b{display:none}}
@media (prefers-reduced-motion:reduce){#ring,.shake{animation:none}#fade,.clean .bar i{transition:none}}
</style>
<div id="app">
  <canvas id="cv" aria-label="Игра «Бамбул»: квартира в разрезе"></canvas>
  <div id="hud" hidden>
    <div class="clock" id="clockBox"><span id="clock">08:00</span><small>до хозяина</small></div>
    <div class="clean"><div class="bar"><i id="cleanBar"></i></div><small id="cleanTxt">Чистота 0%</small></div>
    <div class="hbtns"><button id="bTasks" type="button">Дела</button><button id="bPhone" type="button">Дэн</button><button id="bPause" type="button" aria-label="Пауза">II</button></div>
    <div id="tools"></div>
  </div>
  <div id="ring" hidden><p><small>Входящий звонок</small><b id="ringWho"></b></p><button id="rYes" type="button">Ответить</button><button id="rNo" type="button">Сбросить</button></div>
  <div id="touch" hidden>
    <div id="joy"><div id="knob"></div></div>
    <div class="tb" id="tJ">↑<small>прыжок</small></div>
    <div class="tb" id="tF">F<small>инструмент</small></div>
    <div class="tb" id="tE">E<small>действие</small></div>
  </div>
  <div id="dlg" hidden><div id="dlgAv"></div><div id="dlgWho"></div><p id="dlgTxt"></p><div id="dlgBtns"></div></div>
  <div id="mg" hidden><div class="mgbox" id="mgBox"><header><h2 id="mgT"></h2><button id="mgX" type="button">Бросить</button></header><p id="mgH"></p><div id="mgB"></div></div></div>
  <div id="note" hidden></div>
  <div id="pv" hidden></div>
  <div id="menu"></div>
  <div id="toast"></div>
  <div id="fade"></div>
</div>
<script>
(()=>{'use strict';
/* ================= CORE: utils, settings, audio, input, dialogue database ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function srand(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
const FLOOR=450,CEIL=70,VH=540,GROUND=488,WORLD=4300;

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const CFG=Object.assign({vol:.7,music:true,censor:false,touch:false},store.get('bamboul.cfg',{}));
const saveCfg=()=>store.set('bamboul.cfg',CFG);

/* ---------- audio: everything is synthesized ---------- */
const Snd={ctx:null,master:null,nb:null,vacN:null,mus:{step:0,next:0},musOn:false,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return}
    try{
      const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();
      this.master=this.ctx.createGain();this.master.gain.value=CFG.vol;this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate;this.nb=this.ctx.createBuffer(1,len,len);
      const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){this.ctx=null}
  },
  setVol(v){CFG.vol=v;if(this.master)this.master.gain.value=v},
  tone(f,d,type,v,f2,delay){
    if(!this.ctx)return;const t=this.ctx.currentTime+(delay||0),o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+d+.03);
  },
  noise(d,freq,v,q,delay){
    if(!this.ctx)return;const t=this.ctx.currentTime+(delay||0),s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();
    s.buffer=this.nb;s.loop=true;f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
    g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+d+.03);
  },
  vac(on){
    if(!this.ctx)return;
    if(on&&!this.vacN){
      const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain(),o=this.ctx.createOscillator(),og=this.ctx.createGain();
      s.buffer=this.nb;s.loop=true;f.type='lowpass';f.frequency.value=1100;g.gain.value=.1;o.type='sawtooth';o.frequency.value=92;og.gain.value=.035;
      s.connect(f);f.connect(g);g.connect(this.master);o.connect(og);og.connect(this.master);s.start();o.start();this.vacN={s,o};
    }else if(!on&&this.vacN){try{this.vacN.s.stop();this.vacN.o.stop()}catch(e){}this.vacN=null}
  },
  step(){this.noise(.06,300+Math.random()*200,.05,1.2)},
  pick(){this.tone(420,.08,'triangle',.12,640)},
  toss(){this.noise(.18,900,.12,.8);this.tone(180,.12,'sine',.12,90,.12)},
  ok(){this.tone(523,.1,'triangle',.14);this.tone(784,.16,'triangle',.14,null,.09)},
  bad(){this.tone(180,.22,'sawtooth',.1,90)},
  click(){this.tone(900,.03,'square',.05)},
  scrub(){this.noise(.09,2400+Math.random()*900,.06,2)},
  drip(v){this.tone(1300,.07,'sine',v,500)},
  howl(v){this.tone(310,.7,'sine',v,360);this.tone(317,.7,'sine',v*.7,352)},
  ringT(){this.tone(880,.12,'square',.07);this.tone(1108,.12,'square',.07,null,.15);this.tone(880,.12,'square',.07,null,.3)},
  bell(){this.tone(988,.5,'sine',.2);this.tone(784,.8,'sine',.2,null,.35)},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.2,'triangle',.14,null,i*.11))},
  flush(){this.noise(1.2,700,.18,.6)},
  tickMusic(urgent){
    if(!this.ctx||!CFG.music||!this.musOn)return;
    const now=this.ctx.currentTime,spb=urgent?.14:.19;
    if(this.mus.next<now-.3)this.mus.next=now;
    const bass=[55,0,0,55,0,65.4,0,0,49,0,0,49,0,73.4,65.4,0],lead=[1,1.19,1.5,1.33];
    while(this.mus.next<now+.15){
      const i=this.mus.step%16,dl=Math.max(0,this.mus.next-now);
      if(bass[i])this.tone(bass[i]*2,.17,'triangle',.06,null,dl);
      if(i%4===2)this.noise(.035,6000,.025,2,dl);
      if(i%8===4)this.tone(220*lead[(this.mus.step>>3)%4],.11,'square',.014,null,dl);
      this.mus.step++;this.mus.next+=spb;
    }
  }
};

/* ---------- input abstraction: keyboard and touch feed the same fields ---------- */
const In={keys:{},tAx:0,tUse:false,jump:false,act:false,useEdge:false,usedTouch:false,
  reset(){this.keys={};this.tAx=0;this.tUse=false;this.jump=this.act=this.useEdge=false},
  get ax(){let a=this.tAx;if(this.keys.KeyA||this.keys.ArrowLeft)a-=1;if(this.keys.KeyD||this.keys.ArrowRight)a+=1;return clamp(a,-1,1)},
  get run(){return !!(this.keys.ShiftLeft||this.keys.ShiftRight)||Math.abs(this.tAx)>.92},
  get use(){return !!this.keys.KeyF||this.tUse}
};

/* ---------- dialogue database ---------- */
const SWEAR=/(бля[а-яё]*|пизд[а-яё]*|ху[йеёяю][а-яё]*|[а-яё]*(?:заеб|наеб|проеб|уеб|ебан|ебуч|ёб)[а-яё]*|сук[аи]|говн[а-яё]*|дерьм[а-яё]*|муда[а-яё]*|жоп[а-яё]*|сран[а-яё]*|хер[а-яё]*|хрен[а-яё]*)/gi;
const cz=t=>CFG.censor?t.replace(SWEAR,m=>m[0]+'*'.repeat(Math.max(1,m.length-1))):t;

const FB=FLOOR+14; // where furniture meets the floor
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function RR(g,x,y,w,h,r,c){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=c;g.fill()}
function El(g,x,y,rx,ry,c){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=c;g.fill()}
function LG(g,x0,y0,x1,y1,a,b){const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,a);gr.addColorStop(1,b);return gr}
function Ln(g,x0,y0,x1,y1,c,w){g.strokeStyle=c;g.lineWidth=w||1;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke()}
function Poly(g,pts,c){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();g.fillStyle=c;g.fill()}
function glow(g,x,y,r,c){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function floorShadow(g,x,w,a){El(g,x,FB+3,w/2,7,'rgba(0,0,0,'+(a||.35)+')')}

function wallBase(g,w,c1,c2){
  g.fillStyle=LG(g,0,CEIL,0,FLOOR,c1,c2);g.fillRect(0,CEIL,w,FLOOR-CEIL);

}
function stripes(g,w,c,step,sw){g.fillStyle=c;for(let x=6;x<w;x+=step)g.fillRect(x,CEIL,sw,FLOOR-CEIL)}
function seams(g,w,step){for(let x=step;x<w;x+=step){Ln(g,x,CEIL,x,FLOOR,'rgba(0,0,0,.18)',1);Ln(g,x+1,CEIL,x+1,FLOOR,'rgba(255,255,255,.05)',1)}}

function floorWood(g,w,seed,c1,c2){
  g.fillStyle=LG(g,0,FLOOR,0,VH,c1,c2);g.fillRect(0,FLOOR,w,VH-FLOOR);
  const r=srand(seed),rows=[0,12,28,50,78,112];

    const y=FLOOR+rows[i],h=rows[i+1]-rows[i];Ln(g,0,y,w,y,'rgba(0,0,0,.35)',1.2);
    let x=-r()*120;const pw=120+i*40;
    while(x<w){x+=pw*(.7+r()*.6);Ln(g,x,y,x-4,y+h,'rgba(0,0,0,.3)',1);if(r()<.5)R(g,x-pw*.5,y+1,pw*.45,h-1,'rgba(255,220,160,.035)')}

  }

  R(g,0,FLOOR,w,6,'rgba(0,0,0,.28)');
}
function floorTile(g,w,c1,c2,grout,tw){
  g.fillStyle=LG(g,0,FLOOR,0,VH,c1,c1);g.fillRect(0,FLOOR,w,VH-FLOOR);
  const rows=[0,14,32,56,90];
  for(let i=0;i<rows.length-1;i++){
    const y=FLOOR+rows[i],h=rows[i+1]-rows[i],tws=tw*(1+i*.28);
    for(let x=-tws+(i%2)*tws*.5,k=i;x<w;x+=tws,k++){if(k%2)R(g,x,y,tws,h,c2)}
    Ln(g,0,y,w,y,grout,1.5);for(let x=(i%2)*tws*.5;x<w;x+=tws)Ln(g,x,y,x,y+h,grout,1.2);
  }
  g.fillStyle=LG(g,0,FLOOR,0,VH,'rgba(0,0,0,.25)','rgba(0,0,0,0)');g.fillRect(0,FLOOR,w,VH-FLOOR);
}
function frame(g,x,y,w,h,rot,c,inner){g.save();g.translate(x+w/2,y+h/2);g.rotate(rot);R(g,-w/2+3,-h/2+4,w,h,'rgba(0,0,0,.3)');R(g,-w/2,-h/2,w,h,c);inner(g,-w/2+5,-h/2+5,w-10,h-10);g.restore()}

function nightWindow(g,x,y,w,h,seed){

    for(let k=0;k<6;k++)if(r()<.5)R(g,bx+3+(k%3)*7,y+h-bh+5+Math.floor(k/3)*10,3,4,r()<.5?'#f2c96a':'#8fb0d8')}

  g.fillStyle='rgba(255,255,255,.06)';g.beginPath();g.moveTo(x,y+h);g.lineTo(x+w*.4,y);g.lineTo(x+w*.55,y);g.lineTo(x+w*.15,y+h);g.fill();
}

/* ---------- player ---------- */
function groundAt(x){return (!S.f.boxes&&x>BOX.x0-10&&x<BOX.x1+10)?BOX.h:0}
function canControl(){return S&&S.mode==='play'&&!paused&&!Dlg.active&&!MG.active&&!P.act&&!noteOpen}
function updatePlayer(dt){
  const ctl=canControl();let ax=ctl?In.ax:0;P.using=null;
  if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur){const cb=P.act.cb;P.act=null;cb&&cb()}}
  if(ctl){
    if(In.act){const e=findE();if(e)e.act()}
    if(!P.act&&In.use&&P.elev<=groundAt(P.x)+.5){
      const f=findF();
      if(f){
        if(!S.tools[f.tool]){if(In.useEdge){say(f.tool==='mop'?'needMop':'needVac',1);mood('inspect',1.2)}}
        else if(f.tool==='vac'&&S.f.jam){if(In.useEdge)say('jamWait',1)}
        else{
          if(S.active!==f.tool){S.active=f.tool;buildTools()}
          if(Math.abs(f.x-P.x)>24)P.dir=f.x>P.x?1:-1;P.using=f.tool;ax=0;
          f.o.p-=dt/(f.kind==='stain'?1.5:1.25);
          if(Math.random()<dt*9&&f.tool==='mop')Snd.scrub();
          if(f.o.p<=0){f.o.p=0;Snd.ok();say(f.kind,1);
            if(f.kind==='dust'){S.f.vacN++;if(S.f.vacN===3&&!S.f.jamDone){S.f.jam=1;Snd.bad();say('jam',1);mood('angry',1.6)}}
            done()}
        }
      }else if(In.useEdge)say('nothing');
    }
    if(In.jump&&P.elev<=groundAt(P.x)+.5&&!P.using){P.vy=430;Snd.tone(300,.12,'sine',.06,520)}
  }
  Snd.vac(P.using==='vac'&&!paused);
  // horizontal
  const sp=(In.run&&ctl?238:132)*(S&&S.trash>=4?.9:1),tv=ax*sp;
  const acc=(Math.abs(tv)>Math.abs(P.vx)?1500:2400)*dt;
  P.accel=tv-P.vx;
  P.vx=Math.abs(tv-P.vx)<=acc?tv:P.vx+Math.sign(tv-P.vx)*acc;
  if(ax>.05)P.dir=1;else if(ax<-.05)P.dir=-1;
  let nx=P.x+P.vx*dt;
  if(S&&!S.f.boxes&&P.elev<BOX.h-3){ // solid pile of boxes
    if(P.x<=BOX.x0-10&&nx>BOX.x0-10){nx=BOX.x0-10;P.vx=0}
    else if(P.x>=BOX.x1+10&&nx<BOX.x1+10){nx=BOX.x1+10;P.vx=0}
  }
  P.x=clamp(nx,40,WORLD-40);
  // vertical
  const gnd=S?groundAt(P.x):0;
  if(P.elev>gnd||P.vy>0){P.vy-=1350*dt;P.elev+=P.vy*dt;if(P.elev<=gnd){P.elev=gnd;if(P.vy<-200){P.landT=.16;Snd.step()}P.vy=0}}
  else P.elev=gnd;
  if(!isFinite(P.x)||!isFinite(P.elev)){P.x=1300;P.elev=0;P.vx=P.vy=0}
  // animation state machine
  const moving=Math.abs(P.vx)>12,air=P.elev>gnd+1;
  if(P.landT>0)P.landT-=dt;if(P.moodT>0)P.moodT-=dt;else P.mood=null;
  if(moving){P.stopT=.14}else if(P.stopT>0)P.stopT-=dt;
  let st;
  if(P.force)st=P.force;
  else if(P.act)st=P.act.type;
  else if(MG.active&&!Dlg.active)st=P.mgPose||'repair';
  else if(Dlg.active&&Dlg.phone)st=Dlg.pose||'phone';
  else if(P.using)st=P.using;
  else if(air)st=P.vy>0?'jump':'fall';
  else if(P.landT>0)st='land';
  else if(moving)st=Math.abs(P.vx)>170?'run':(S&&(S.trash||S.cl)?'carry':'walk');
  else if(P.stopT>0&&Math.abs(P.accel)>40)st='stop';
  else if(P.mood)st=P.mood;
  else if(S&&S.mode==='play'&&S.time<25&&score()<60)st='tired';
  else st='idle';
  P.st=st;
  const cyc=st==='walk'||st==='run'||st==='carry';
  if(cyc||P.force==='walk'||P.force==='run'){
    const A=st==='run'?33:25,v=P.force?(st==='run'?238:132):Math.abs(P.vx);
    const prev=P.ph;P.ph+=v*Math.PI/(2*A)*dt;
    if(Math.floor(prev/Math.PI)!==Math.floor(P.ph/Math.PI)&&!P.force)Snd.step();
  }
  const k=P.act?P.act.t/P.act.dur:(tGlobal%1.2)/1.2;
  const tg=poseFor(st,tGlobal,P.ph,k);
  blendPose(P.pose,tg,1-Math.exp(-dt*(cyc?34:14)));
  P.face=lerp(P.face,P.dir,1-Math.exp(-dt*22));
}
function heldItem(){
  const st=P.st;
  if(st==='phone'||st==='listen'||st==='nervous')return 'phone';
  if(st==='mop'||st==='vac')return st;
  if(st==='repair')return 'wrench';if(st==='scrub')return 'cloth';
  if(st==='cheer'||st==='shock'||st==='sit'||st==='toss'&&P.act&&P.act.t/P.act.dur>.55||st==='haul'||st==='tinker'||st==='open'||st==='door')return null;
  if(!S)return null;
  if(S.trash)return 'bag';if(S.cl)return 'clothes';
  if(st==='pickup'||st==='inspect'||st==='angry')return null;
  return {mop:'mopC',vac:'vacC',box:'box'}[S.active]||null;
}

const WHO={L:['Аркадий Семёнович','А'],B:['Бамбул','Б'],D:['Дэн, брат','Д'],N:['','…']};
const Dlg={active:false,q:[],i:0,end:null,phone:false,pose:null,
  run(lines,end,phone){this.active=true;this.q=lines.slice();this.i=0;this.end=end;this.phone=!!phone;$('#dlg').hidden=false;$('#mg').hidden=true;this.show()},
  show(){
    const l=this.q[this.i];if(!l){this.close();return}
    const bt=$('#dlgBtns');bt.innerHTML='';
    if(l.c){$('#dlgWho').textContent='Бамбул';$('#dlgAv').textContent='Б';$('#dlgTxt').textContent='Что ответить?';this.pose='phone';
      l.c.forEach((c,i)=>{const b=btn((i+1)+'. '+cz(c[0]),()=>this.choose(c),i?'alt':'');bt.append(b)})}
    else{const w=WHO[l[0]];$('#dlgWho').textContent=w[0];$('#dlgAv').textContent=w[1];$('#dlgTxt').textContent=cz(l[1]);
      this.pose=l[0]==='D'?'listen':l[0]==='L'?'nervous':'phone';
      bt.append(btn(this.i>=this.q.length-1?'Ладно':'Дальше',()=>this.next()))}
  },
  next(){const l=this.q[this.i];if(!l||l.c)return;this.i++;this.show()},
  choose(c){const more=c[1]?c[1]():null;this.q.splice(this.i+1,0,...(more||[]));this.i++;this.show()},
  key(e){const l=this.q[this.i];if(!l)return;
    if(l.c){const n=parseInt(e.key,10);if(n>=1&&n<=l.c.length){Snd.click();this.choose(l.c[n-1])}}
    else if(['Enter','Space','KeyE'].includes(e.code)){Snd.click();this.next()}},
  close(){this.active=false;this.phone=false;$('#dlg').hidden=true;if(MG.active)$('#mg').hidden=false;const e=this.end;this.end=null;e&&e()}
};

/* ---------- minigame framework ---------- */
const MG={active:false,cur:null,
  open(o){this.cur=o;this.active=true;$('#mgT').textContent=o.title;$('#mgH').textContent=o.hint||'';const b=$('#mgB');b.innerHTML='';o.build(b);$('#mg').hidden=false;P.mgPose=o.pose||'repair';P.vx=0},
  close(won){if(!this.active)return;const o=this.cur;this.active=false;this.cur=null;$('#mg').hidden=true;P.mgPose=null;o.cleanup&&o.cleanup();if(won){o.win&&o.win()}},
  tick(dt){if(this.active&&!Dlg.active&&!paused&&this.cur.tick)this.cur.tick(dt)},
  key(e,down){if(down&&e.code==='Escape'){this.close(false);return}if(this.cur.key)this.cur.key(e,down)}
};
$('#mgX').addEventListener('click',()=>MG.close(false));
const HIT=['Space','KeyE','KeyF','Enter'];
function shake(){const b=$('#mgBox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}

function timingMG(o){
  let pos=0,dir=1,n=0,z0=0,zw=.17,sp=o.speed||.9,mark,zone,dots;
  const newZone=()=>{z0=.1+Math.random()*(.8-zw);zone.style.left=z0*100+'%';zone.style.width=zw*100+'%'};
  const hit=()=>{if(pos>=z0&&pos<=z0+zw){n++;Snd.ok();[...dots.children].forEach((d,i)=>d.classList.toggle('ok',i<n));if(n>=o.rounds){MG.close(true);return}sp*=1.18;zw*=.9;newZone()}else{Snd.bad();shake();o.miss&&o.miss()}};
  MG.open({title:o.title,hint:o.hint,pose:o.pose,win:o.win,
    build(b){const bar=el('div','tbar');zone=el('div','tzone');mark=el('div','tmark');bar.append(zone,mark);dots=el('div','dots');for(let i=0;i<o.rounds;i++)dots.append(el('i'));
      const bt=btn(o.btn||'Крутить!',hit);bt.classList.add('mgbig');b.append(bar,dots,bt);newZone()},
    tick(dt){pos+=dir*sp*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}mark.style.left=pos*100+'%'},
    key(e,down){if(down&&HIT.includes(e.code))hit()}});
}
function mashMG(o){
  let n=0,bar;const hit=()=>{n++;Snd.scrub();bar.style.width=n/o.n*100+'%';if(n>=o.n)MG.close(true)};
  MG.open({title:o.title,hint:o.hint,pose:o.pose,win:o.win,
    build(b){const pr=el('div','prog');bar=el('i');pr.append(bar);const bt=btn(o.btn||'Тяни!',hit);bt.classList.add('mgbig');b.append(bt,pr)},
    key(e,down){if(down&&HIT.includes(e.code))hit()}});
}
function rubMG(o){
  let st=0,spots=[],c,g,px=-99,py=-99,down=false,auto=false;const W=360,H=240;
  const setup=()=>{spots=[];const r=srand(100+st*17+(o.seed||0));for(let i=0;i<(o.spots||9);i++)spots.push({x:60+r()*(W-120),y:50+r()*(H-100),r:16+r()*16,a:1,c:['#4a3a12','#5a5a1a','#6a2a1a','#3a4a1a'][i%4]})};
  const rub=(x,y,amt)=>{let any=false;for(const s of spots){if(s.a>0&&Math.hypot(s.x-x,s.y-y)<s.r+20){s.a-=amt;any=true}}if(any&&Math.random()<.3)Snd.scrub();
    if(spots.every(s=>s.a<=0)){st++;Snd.ok();if(st>=o.stages.length){MG.close(true)}else setup()}};
  const pos=e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)/r.width*W;py=(e.clientY-r.top)/r.height*H};
  const draw=()=>{g.clearRect(0,0,W,H);o.stages[Math.min(st,o.stages.length-1)](g,W,H);for(const s of spots){if(s.a<=0)continue;g.globalAlpha=clamp(s.a,0,1)*.9;El(g,s.x,s.y,s.r,s.r*.8,s.c);El(g,s.x+s.r*.5,s.y-s.r*.3,s.r*.5,s.r*.4,s.c);g.globalAlpha=1}
    RR(g,px-17,py-12,34,24,6,'#d9a93a');R(g,px-17,py+4,34,5,'#86ad55');
    g.fillStyle='#efe2c4';g.font='600 13px "Golos Text",Arial,sans-serif';g.textBaseline='top';g.fillText((st+1)+' / '+o.stages.length,10,8)};
  MG.open({title:o.title,hint:o.hint,pose:o.pose||'scrub',win:o.win,
    build(b){c=el('canvas','rub');c.width=W;c.height=H;g=c.getContext('2d');b.append(c);setup();
      c.addEventListener('pointerdown',e=>{down=true;try{c.setPointerCapture(e.pointerId)}catch(_){}pos(e);rub(px,py,.12)});
      c.addEventListener('pointermove',e=>{pos(e);if(down||e.pointerType==='mouse'&&e.buttons)rub(px,py,.1)});
      const up=()=>{down=false};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)},
    tick(dt){if(auto){const s=spots.find(s=>s.a>0);if(s){px=s.x+Math.sin(tGlobal*14)*10;py=s.y+Math.cos(tGlobal*11)*6;rub(s.x,s.y,dt*1.7)}}if(MG.active)draw()},
    key(e,down){if(e.code==='Space'||e.code==='KeyF'||e.code==='KeyE')auto=down}});
}
function balanceMG(o){
  let temp=170,hold=false,prog=0,mark,lab,bar;const lo=150,hi=270,z0=212,z1=232;
  MG.open({title:o.title,hint:o.hint,pose:'tinker',win:o.win,
    build(b){lab=el('div','temp','170°C');const gz=el('div','gauge');const z=el('div','tzone');z.style.left=(z0-lo)/(hi-lo)*100+'%';z.style.width=(z1-z0)/(hi-lo)*100+'%';mark=el('div','tmark');gz.append(z,mark);
      const pr=el('div','prog');bar=el('i');pr.append(bar);const bt=el('button','btn mgbig','Греть (держать)');bt.type='button';
      const dn=e=>{e.preventDefault();hold=true;Snd.init()},up=()=>{hold=false};bt.addEventListener('pointerdown',dn);bt.addEventListener('pointerup',up);bt.addEventListener('pointerleave',up);bt.addEventListener('pointercancel',up);
      b.append(lab,gz,pr,bt)},
    tick(dt){temp+=(hold?62:-44)*dt;temp=clamp(temp,lo,hi);if(temp>=z0&&temp<=z1){prog+=dt/3;if(Math.random()<dt*6)Snd.tone(600+prog*500,.04,'sine',.04)}else prog=Math.max(0,prog-dt*.15);
      if(temp>=258){temp=175;prog=0;hold=false;Snd.bad();shake();o.fail&&o.fail()}
      mark.style.left=(temp-lo)/(hi-lo)*100+'%';lab.textContent=Math.round(temp)+'°C';bar.style.width=clamp(prog,0,1)*100+'%';if(prog>=1)MG.close(true)},
    key(e,down){if(HIT.includes(e.code))hold=down}});
}
function listMG(o){ // pick among labelled cards
  MG.open({title:o.title,hint:o.hint,pose:o.pose,win:o.win,
    build(b){const grid=el('div','fr');o.items.forEach((it,i)=>{const bt=el('button');bt.type='button';bt.append(document.createTextNode((i+1)+'. '+cz(it.n)));if(it.d)bt.append(el('small','',cz(it.d)));
      bt.addEventListener('click',()=>o.pick(it,bt,grid));grid.append(bt)});b.append(grid);this.grid=grid},
    key(e,down){if(!down)return;const n=parseInt(e.key,10);if(n>=1&&n<=o.items.length){const bt=this.grid.children[n-1];if(bt&&!bt.classList.contains('gone'))bt.click()}}});
}

  const f=S.f,L=[];
  if(!f.sink)L.push(['L','Кран воет на весь подъезд! Я его ещё с лестницы услышал.']);else L.push(['L','Кран не течёт. Надо же. Чудеса.']);
  if(!f.fridge)L.push(['L','(открывает холодильник) Матерь божья… Закрой. Закрой немедленно.']);
  if(!f.toilet)L.push(['L','Смыв не работает? Ты как тут живёшь вообще?']);
  if(!f.printer)L.push(['L','А эта коробка в комнате дымится — так и надо?']);
  if(S.trash)L.push(['L','А мешок с мусором в руке — это у тебя аксессуар такой?'],['B','Это… сумка. Модная.']);
  if(S.dep<NG*.6)L.push(['L','Я на что-то наступил. Оно хрустнуло. Я не хочу знать, что это.']);
  if(sc>=90)L.push(['L','Бамбул… Я, признаться, шёл тебя выселять. А тут… Ты что, клининг вызывал?'],['B','Сам, Аркадий Семёныч. Вот этими руками.'],['L','Ну, раз так — аренду в этом году не подниму. Живи.']);
  else if(sc>=65)L.push(['L','Ну… жить можно. Но что не доделал — доделай до пятницы. Я проверю.'],['B','Конечно. До пятницы. Какого года — не уточняем.']);
  else if(sc>=35)L.push(['L','Это что за свинарник? Штраф из залога. И через неделю я приду снова.'],['B','Понял. Принял. Охренел.']);
  else L.push(['L','Собирай вещи. Чтоб до воскресенья духу твоего тут не было.'],['B','Дэн, привет. Слушай, а у тебя диван свободен?'],['D','Нет.']);
  return L;
}
function updateEnding(dt){
  if(!landlord)return;const l=landlord;
  if(l.walk){l.x+=110*dt;l.ph+=110*Math.PI/50*dt;blendPose(l.pose,poseFor('walk',tGlobal,l.ph,0),.5);
    if(l.x>=215){l.walk=false;const sc=score();setTimeout(()=>Dlg.run(endingLines(sc),()=>showMenu('result',sc),false),500)}}
  else blendPose(l.pose,poseFor(score()>=65?'idle':'inspect',tGlobal,0,0),.12);
}

/* ---------- menus ---------- */
let menuKind=null,menuBack=null;
function hideMenu(){$('#menu').hidden=true;$('#menu').innerHTML='';menuKind=null}
function showMenu(kind,arg){
  menuKind=kind;const m=$('#menu');m.innerHTML='';m.hidden=false;const s=el('div','sheet');m.append(s);
  const h2=t=>{const h=el('h2','',t);s.append(h)};
  if(kind==='title'){
    s.append(el('h1','title','БАМБУЛ'),el('p','tag','Хозяин уже едет. Квартира к этому не готова. Бамбул — тем более.'));
    const c=el('div','col');if(hasSave())c.append(btn('Продолжить уборку',continueGame));
    c.append(btn('Новая игра',()=>showMenu('new'),hasSave()?'alt':''),btn('Как играть',()=>{menuBack='title';showMenu('help')},'alt'),btn('Настройки',()=>{menuBack='title';showMenu('settings')},'alt'),btn('Примерочная: анимации',startPreview,'alt'));
    s.append(c);const best=store.get('bamboul.best',null);if(best!=null)s.append(el('p','fine','Лучший результат: '+best+'% чистоты.'));
    s.append(el('p','fine','В игре много русского мата. Его можно запикать в настройках.'));
  }else if(kind==='new'){
    h2('Когда приедет хозяин?');const c=el('div','col');
    c.append(btn('Через 8 минут — обычная смена',()=>startGame(480)),btn('Через 5 минут — он уже в подъезде',()=>startGame(300),'alt'),btn('Назад',()=>showMenu('title'),'alt'));s.append(c);
    s.append(el('p','fine','Всё убрать за один заход почти нереально. Выбирай, что важнее: хозяин оценит квартиру как есть.'));
  }else if(kind==='help'){
    h2('Как играть');const dl=el('dl','keys');
    [['A / D, ← / →','ходить; на телефоне — стик слева'],['Shift','бежать; на телефоне — стик до упора'],['E','действие: подобрать, открыть, починить'],['F (держать)','тереть шваброй и пылесосить; нужный инструмент берётся сам'],['Пробел','прыжок: через завал в коридоре'],['1–4','выбрать инструмент'],['Tab','список дел'],['T','позвонить Дэну за подсказкой'],['Esc','пауза']].forEach(([k,v])=>dl.append(el('dt','',k),el('dd','',v)));
    s.append(dl,el('p','fine','Мусор носи в мешок у входа или в ведро на кухне, не больше пяти штук за раз. Шмотки — в стиралку. Для ремонта нужен ящик с инструментами из мастерской.'),btn('Понятно',()=>showMenu(menuBack||'title')));
  }else if(kind==='settings'){
    h2('Настройки');const c=el('div','col');
    const row=(label,input)=>{const l=el('label','set');l.append(el('span','',label),input);c.append(l)};
    const vol=el('input');vol.type='range';vol.id='setVol';vol.min=0;vol.max=1;vol.step=.05;vol.value=CFG.vol;vol.addEventListener('input',()=>{Snd.init();Snd.setVol(+vol.value);saveCfg()});row('Громкость',vol);
    const chk=(id,key,label,fn)=>{const i=el('input');i.type='checkbox';i.id=id;i.checked=!!CFG[key];i.addEventListener('change',()=>{CFG[key]=i.checked;saveCfg();fn&&fn()});row(label,i)};
    chk('setMus','music','Музыка');chk('setCz','censor','Запикать мат');chk('setTouch','touch','Сенсорные кнопки всегда',applyTouch);
    const fs=btn('Во весь экран',()=>{try{const a=$('#app');(document.fullscreenElement?document.exitFullscreen():a.requestFullscreen()).catch(()=>toast('Здесь полный экран недоступен'))}catch(e){toast('Здесь полный экран недоступен')}},'alt');
    c.append(fs,btn('Готово',()=>showMenu(menuBack||'title')));s.append(c);
  }else if(kind==='pause'){
    h2('Пауза. Хозяин, к сожалению, нет');const c=el('div','col');
    c.append(btn('Продолжить',resume),btn('Список дел',()=>{resume();openNote()},'alt'),btn('Как играть',()=>{menuBack='pause';showMenu('help')},'alt'),btn('Настройки',()=>{menuBack='pause';showMenu('settings')},'alt'),btn('Начать заново',()=>showMenu('new'),'alt'),btn('В главное меню',toTitle,'bad'));s.append(c);
  }else if(kind==='door'){
    paused=true;h2('Открыть хозяину прямо сейчас?');s.append(el('p','tag','Чистота '+arg+'%. Осталось '+fmt(S.time)+'. Назад дороги не будет.'));
    const c=el('div','col');c.append(btn('Нет, я ещё поубираю',resume),btn('Открыть дверь',()=>{paused=false;hideMenu();startEnding(true)},'bad'));s.append(c);
  }else if(kind==='result'){
    const sc=arg,t=sc>=90?'ОБРАЗЦОВЫЙ ЖИЛЕЦ':sc>=65?'ПРОНЕСЛО':sc>=35?'ПОСЛЕДНЕЕ ПРЕДУПРЕЖДЕНИЕ':'ВЫСЕЛЕН';
    const best=Math.max(sc,store.get('bamboul.best',0)||0);store.set('bamboul.best',best);
    h2(t);s.append(el('div','grade',sc+'%'));
    const p=el('div','paper');p.append(el('h3','','Акт осмотра квартиры'));const ul=el('ul');
    for(const a of parts()){const li=el('li',a[2]>=1?'done':'');li.append(el('span','',a[1]),el('span','',a[4]||(a[2]>=1?'готово':'нет')));ul.append(li)}
    p.append(ul);if(S.lazy)p.append(el('p','','Прокрастинировал: '+S.lazy+' раз(а).'));if(S.early)p.append(el('p','','Открыл сам, в запасе было '+fmt(S.early)+'.'));s.append(p);
    const r=el('div','rowb');r.append(btn('Ещё раз',()=>showMenu('new')),btn('В меню',toTitle,'alt'));s.append(r);
  }
  const f=m.querySelector('button');if(f&&!isTouch)f.focus({preventScroll:true});
}
function pause(){if(!S||S.mode!=='play'||paused)return;paused=true;In.reset();Snd.vac(false);saveGame();showMenu('pause')}
function resume(){paused=false;hideMenu();In.reset()}
function toTitle(){if(S&&S.mode==='play')saveGame();S=null;paused=false;landlord=null;Snd.musOn=false;Snd.vac(false);MG.close(false);ringOff();Dlg.active=false;$('#dlg').hidden=true;$('#hud').hidden=true;$('#touch').hidden=true;P.x=1300;P.elev=0;P.dir=1;P.act=null;P.force=null;bubble.t=0;showMenu('title')}
function applyTouch(){const on=!!(S&&S.mode==='play')&&(CFG.touch||isTouch);$('#touch').hidden=!on;$('#app').classList.toggle('touch',CFG.touch||isTouch)}
function enterPlay(){
  paused=false;landlord=null;hideMenu();closeNote();$('#fade').classList.remove('on');$('#hud').hidden=false;applyTouch();buildTools();updateHud(true);
  Snd.init();Snd.musOn=true;In.reset();P.elev=0;P.vx=P.vy=0;P.act=null;P.force=null;P.mood=null;updateCamera(0,true);
}
function startGame(total){
  S=newState(total);P.x=1300;P.dir=1;bubble.t=0;enterPlay();store.del('bamboul.save');
  S.calls.intro=1;doAct('sit',1.2,()=>{Snd.ringT();mood('shock',.8);setTimeout(()=>{if(S&&S.mode==='play')Dlg.run(CALLS.intro(),()=>{mood('shock',1.6);say('Так. Мусор, пятна, кран, холодильник. Погнали.',1)},true)},500)});
}
function continueGame(){const s=store.get('bamboul.save',null);if(!s){showMenu('new');return}S=Object.assign(newState(s.total||480),s);S.f=Object.assign(newState(1).f,s.f);P.x=clamp(+S.px||1300,60,WORLD-60);enterPlay();say('Так, на чём я остановился…',1)}

/* ---------- animation preview scene ---------- */
function startPreview(){
  hideMenu();P.force='idle';const pv=$('#pv');pv.innerHTML='';pv.hidden=false;
  ANIMS.forEach(([k,n],i)=>{const b=el('button',i?'':'on',n);b.type='button';b.addEventListener('click',()=>{P.force=k;[...pv.children].forEach(c=>c.classList.remove('on'));b.classList.add('on')});pv.append(b)});
  const flip=el('button','','Развернуть');flip.type='button';flip.addEventListener('click',()=>{P.dir*=-1});
  const back=el('button','','Назад в меню');back.type='button';back.addEventListener('click',()=>{pv.hidden=true;P.force=null;P.dir=1;showMenu('title')});pv.append(flip,back);
}
function previewHeld(){return {carry:'bag',mop:'mop',vac:'vac',repair:'wrench',scrub:'cloth',phone:'phone',listen:'phone',nervous:'phone'}[P.force]||null}

/* ---------- input wiring ---------- */
function onKey(e){
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const c=e.code;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Tab'].includes(c))e.preventDefault();
  if(e.repeat)return;Snd.init();
  if(menuKind){if(c==='Escape'){if(menuKind==='pause'||menuKind==='door')resume();else if(menuKind==='help'||menuKind==='settings')showMenu(menuBack||'title');else if(menuKind==='new')showMenu(S&&S.mode==='play'?'pause':'title')}return}
  if(!S){return}
  if(Dlg.active){Dlg.key(e);return}
  if(noteOpen){if(['Tab','Escape','KeyE','Enter','Space'].includes(c))closeNote();return}
  if(Ring.active){if(c==='Enter'||c==='KeyY'){answer();return}if(c==='Backspace'||c==='KeyN'){decline();return}}
  if(MG.active){MG.key(e,true);return}
  if(S.mode!=='play')return;
  In.keys[c]=true;
  if(c==='KeyE'||c==='Enter')In.act=true;else if(c==='KeyF')In.useEdge=true;else if(c==='Space'||c==='ArrowUp'||c==='KeyW')In.jump=true;
  else if(c==='Escape'||c==='KeyP')pause();else if(c==='Tab')openNote();else if(c==='KeyT')callDan();
  else if(/^Digit[1-4]$/.test(c))selectTool(TOOLS[+c[5]-1][0]);
}
addEventListener('keydown',onKey);
addEventListener('keyup',e=>{delete In.keys[e.code];if(MG.active)MG.key(e,false)});
addEventListener('blur',()=>{In.reset();if(S&&S.mode==='play'&&!menuKind&&!Dlg.active)pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){In.reset();Snd.vac(false);if(S&&S.mode==='play'&&!menuKind&&!Dlg.active)pause()}});
addEventListener('resize',resize);addEventListener('orientationchange',()=>{In.reset();setTimeout(resize,200)});
addEventListener('touchstart',()=>{if(!isTouch){isTouch=true;applyTouch()}},{passive:true});
cv.addEventListener('pointerdown',()=>{Snd.init();if(Dlg.active)return});
$('#dlg').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON'){Snd.click();Dlg.next()}});
$('#bPause').addEventListener('click',pause);$('#bTasks').addEventListener('click',()=>{if(canControl())openNote()});$('#bPhone').addEventListener('click',callDan);
$('#rYes').addEventListener('click',answer);$('#rNo').addEventListener('click',decline);
// joystick
(()=>{const joy=$('#joy'),knob=$('#knob');let id=null;
  const set=e=>{const r=joy.getBoundingClientRect(),dx=clamp((e.clientX-(r.left+r.width/2))/46,-1,1);In.tAx=Math.abs(dx)<.18?0:dx;knob.style.transform='translateX('+dx*38+'px)'};
  const end=e=>{if(e.pointerId!==id)return;id=null;In.tAx=0;knob.style.transform=''};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{joy.setPointerCapture(id)}catch(_){}Snd.init();set(e)});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,end));
  const hold=(sel,dn,up)=>{const b=$(sel);let pid=null;
    b.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{b.setPointerCapture(pid)}catch(_){}b.classList.add('down');Snd.init();dn()});
    const u=e=>{if(e.pointerId!==pid)return;pid=null;b.classList.remove('down');up&&up()};['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,u))};
  hold('#tE',()=>{if(noteOpen)closeNote();else In.act=true});
  hold('#tF',()=>{In.tUse=true;In.useEdge=true},()=>{In.tUse=false});
  hold('#tJ',()=>{In.jump=true});
})();

/* ---------- main loop ---------- */
let last=0;
function tick(now){
  requestAnimationFrame(tick);
  let dt=Math.min(.05,(now-last)/1000||0);last=now;tGlobal+=dt;
  if(!cw)resize();if(!cw)return;
  if(bubble.t>0)bubble.t-=dt;
  if(S&&S.mode==='play'){
    if(!paused){
      if(Ring.active){Ring.t-=dt;Ring.beep-=dt;if(Ring.beep<=0){Ring.beep=1.5;Snd.ringT()}if(Ring.t<=0)decline()}
      updateWorld(dt);MG.tick(dt);updatePlayer(dt);
      saveT+=dt;if(saveT>5){saveT=0;saveGame()}
      Snd.tickMusic(S&&S.time<60);
    }
    updateHud();
  }else if(S&&S.mode==='ending'){updatePlayer(dt);updateEnding(dt)}
  else{updatePlayer(dt)}
  In.act=In.jump=In.useEdge=false;
  updateCamera(dt);
  render();
}
/* preview and menu use the held-item override */
const _held=heldItem;
heldItem=function(){return (!S&&P.force)?previewHeld():_held()};

function boot(data){
  resize();updateCamera(0,true);
  if(data&&data.save&&data.save.mode==='play'){store.set('bamboul.save',data.save);continueGame();pause()}
  else showMenu('title');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
  requestAnimationFrame(tick);
}
const hot=window.claude&&window.claude.hot;
try{hot&&hot.snapshot&&hot.snapshot(()=>({save:S&&S.mode==='play'?S:null}))}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
window.__bamboul={get S(){return S},P,In,MG,Dlg,score,startGame,startEnding,Ring};
})();
</script>
